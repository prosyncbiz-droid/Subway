<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- نظام حماية CSP لمنع الثغرات والأكواد الخبيثة -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://images.unsplash.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com;">

    <title id="app-title">عالم القصص والروايات</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b1528;
            --card-bg: #111e36;
            --text-color: #ffffff;
            --text-secondary: #8d9bb0;
            --accent-color: #f1c40f;
            --accent-hover: #d4ac0d;
            --border-color: #1c2d4a;
            --reader-font-size: 1.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }

        header .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        header .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-color);
        }

        .search-bar {
            display: none;
            padding: 10px 15px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar.active {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 380px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        main {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .series-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .series-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .hero-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 220px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background-image 0.3s ease;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(11, 21, 40, 0.95), transparent);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            color: var(--accent-color);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .hero-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .chapter-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .chapter-card:active {
            transform: scale(0.98);
        }

        .chapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chapter-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .chapter-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .reader-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .reader-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .reader-text {
            font-size: var(--reader-font-size);
            line-height: 1.8;
            color: #e0e6ed;
            white-space: pre-line;
            text-align: justify;
            user-select: text;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .lang-btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: var(--border-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .lang-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header id="main-header">
        <button class="icon-btn" onclick="filterBookmarks()"><i id="header-bookmark-icon" class="fa-regular fa-bookmark"></i></button>
        <div class="header-title" id="header-title">عالم القصص والروايات</div>
        <div class="header-icons">
            <button class="icon-btn" onclick="openChaptersListModal()"><i class="fa-solid fa-list-ul"></i></button>
            <button class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="icon-btn" onclick="openLangModal()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </header>

    <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="ابحث..." oninput="filterChapters()">
        <button class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <main>
        <section id="page-home" class="page active">
            <div class="series-tabs" id="series-tabs"></div>

            <div class="hero-card" id="hero-card">
                <div class="hero-content">
                    <div class="hero-badge" id="hero-badge-text"><i class="fa-solid fa-star"></i> السلسلة الحالية</div>
                    <div class="hero-title" id="hero-title">الباب الأزرق</div>
                </div>
            </div>

            <div class="section-title" id="section-title">اكتشف قصتك التالية</div>
            <div id="chapters-list"></div>
        </section>

        <section id="page-reader" class="page">
            <div class="reader-header">
                <button class="icon-btn" id="reader-back-btn" onclick="showPage('home')"><i class="fa-solid fa-chevron-right"></i></button>
                <div class="reader-title" id="reader-chapter-title">الفصل الأول</div>
                <button class="icon-btn" onclick="openReaderSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
            <div class="reader-text" id="reader-text-content"></div>
        </section>
    </main>

    <div class="modal" id="lang-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="lang-modal-title">تغيير اللغة / Change Language</h3>
                <button class="icon-btn" onclick="closeModal('lang-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="lang-btn" onclick="setLanguage('ar')">العربية (Arabic)</button>
            <button class="lang-btn" onclick="setLanguage('en')">English (الإنجليزية)</button>
            <button class="lang-btn" onclick="setLanguage('es')">Español (الإسبانية)</button>
        </div>
    </div>

    <div class="modal" id="list-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="all-chapters-title">جميع الفصول</h3>
                <button class="icon-btn" onclick="closeModal('list-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-chapters-list" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="font-settings-title">حجم الخط</h3>
                <button class="icon-btn" onclick="closeModal('settings-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; justify-content: space-around; padding: 15px 0;">
                <button class="icon-btn" style="background:var(--border-color); padding: 8px 20px; border-radius:5px;" onclick="changeFontSize(-0.1)">A-</button>
                <button class="icon-btn" style="background:var(--border-color); padding: 8px 20px; border-radius:5px;" onclick="changeFontSize(0.1)">A+</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="setActiveNav('nav-home'); showPage('home'); resetFilter();">
            <i class="fa-solid fa-book-open"></i>
            <span id="lbl-reading">القراءة</span>
        </button>
        <button class="nav-item" id="nav-chapters" onclick="setActiveNav('nav-chapters'); openChaptersListModal();">
            <i class="fa-solid fa-list-ul"></i>
            <span id="lbl-chapters">الفصول</span>
        </button>
        <button class="nav-item" id="nav-bookmarks" onclick="setActiveNav('nav-bookmarks'); filterBookmarks();">
            <i class="fa-regular fa-bookmark"></i>
            <span id="lbl-bookmarks">العلامات</span>
        </button>
    </nav>
    </div>

        temp.textContent = str;

    const translations = {

    const data = {
        series: [
            { id: 'blue_door', nameAr: 'الباب الأزرق', nameEn: 'The Blue Door', nameEs: 'La Puerta Azul', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600' },
            { id: 'signal', nameAr: 'الإشارة', nameEn: 'The Signal', nameEs: 'La Señal', image: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600' },
            { id: 'promise', nameAr: 'الوعد', nameEn: 'The Promise', nameEs: 'La Promesa', image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600' },
            { id: 'package', nameAr: 'الطرد الغريب', nameEn: 'The Strange Parcel', nameEs: 'El Paquete Extraño', image: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=600' },

            { id: 'forest', nameAr: 'الغابة السابعة', nameEn: 'The Seventh Forest', nameEs: 'El Séptimo Bosque', image: 'https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600' },
            { id: 'midnight', nameAr: 'مدينة منتصف الليل', nameEn: 'Midnight City', nameEs: 'Ciudad de Medianoche', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600' }
        ],
        chapters: [
            /* القصة 1: الباب الأزرق */
            {
                id: 101,
                seriesId: 'blue_door',
                titleAr: 'الفصل الأول: الباب الأزرق',
                titleEn: 'Chapter 1: The Blue Door',
                titleEs: 'Capítulo 1: La Puerta Azul',
                descAr: 'كان سامر يحب استكشاف الأماكن القديمة، حتى وجد باباً أزرق صغيراً في جدار حجري قديم...',
                descEn: 'Samer loved exploring old places until he found a small blue door set in an old stone wall...',
                descEs: 'A Samer le encantaba explorar lugares antiguos hasta que encontró una pequeña puerta azul en un viejo muro...',
                contentAr: `كان سامر يحب استكشاف الأماكن القديمة في مدينته.
وفي صباح يومٍ شتوي، وبينما كان يسير قرب محطة القطار المهجورة، لاحظ شيئًا لم يره من قبل.
باب أزرق صغير، مثبت في جدار حجري قديم.
اقترب منه.
لم يكن للباب مقبض، ولا نافذة، ولا أي علامة تدل على المكان الذي يؤدي إليه.
لكن في منتصفه كانت هناك جملة محفورة:
"لا تفتحني إلا إذا كنت مستعدًا لمعرفة ما تبحث عنه."
ضحك سامر: "ومن قال إنني أبحث عن شيء؟"
وضع يده على الباب، وفجأة ظهر مقبض فضي. فتح الباب، وخلفه لم تكن هناك غرفة، بل طريق طويل تحيط به أشجار مضيئة، وفي السماء قمر ضخم بلون أزرق.
وسمع صوتًا خلفه: "أخيرًا وجدته." كانت فتاة تسمى ليان، وقالت: "هذا الباب لا يظهر إلا لشخصين… دخلت وتبعتها، وأُغلق الباب خلفهما واختفى.`,
                contentEn: `Samer loved exploring old places in his city. On a cold winter morning near an abandoned train station, he found a small blue door with an engraved sentence: "Do not open me unless you are ready to know what you are looking for."
Upon touching it, a silver handle appeared. Opening it revealed a path surrounded by glowing trees under a giant blue moon. A girl named Layan joined him, explaining the door only appears to two people. Together, they stepped through as the door vanished behind them.`,
                contentEs: `A Samer le encantaba explorar lugares antiguos. En una mañana de invierno cerca de una estación abandonada, encontró una pequeña puerta azul con una frase grabada: "No me abras a menos que estés listo para saber qué buscas."
Al tocarla, apareció un pomo de plata. Al abrirla, reveló un camino rodeado de árboles brillantes bajo una enorme luna azul. Una chica llamada Layan se le unió, explicando que la puerta solo se muestra a dos personas. Juntos cruzaron mientras la puerta desaparecía tras ellos.`
            },
            {
                id: 102,
                seriesId: 'blue_door',
                titleAr: 'الفصل الثاني: مدينة بلا ساعات',
                titleEn: 'Chapter 2: A City Without Clocks',
                titleEs: 'Capítulo 2: Una Ciudad sin Relojes',
                descAr: 'سار الاثنان حتى ظهرت أمامهما مدينة غريبة خالية من الساعات...',
                descEn: 'The two walked until an odd city appeared before them, completely devoid of clocks...',
                descEs: 'Los dos caminaron hasta que apareció ante ellos una extraña ciudad sin relojes...',
                contentAr: `سار الاثنان في الطريق حتى ظهرت أمامهما مدينة غريبة. مبانٍ بيضاء مرتفعة، وجسور معلقة، ومصابيح تطير، لكن لم تكن هناك ساعة واحدة.
أخبرهما رجل عجوز: "هنا المكان الذي تأتي إليه الأشياء التي نسيها البشر… ذكريات ضائعة، وأشخاص."
وأراهم صورة لفترة منذ عشرين عاماً لفتى يشبه سامر تماماً، وقال العجوز: "هذا والدك. إذا أردتما العودة، فعليكما العثور عليه أولًا قبل أن تنسى المدينة وجودكما."`,
                contentEn: `They reached a strange city without a single clock. An old man explained it was a place for forgotten things and people. He showed Samer a photo from 20 years ago depicting his father. "If you wish to return, you must find him before the city forgets you exist."`,
                contentEs: `Llegaron a una extraña ciudad sin un solo reloj. Un anciano explicó que era un lugar para cosas y personas olvidadas. Le mostró a Samer una foto de hace 20 años de su padre. "Si quieren regresar, deben encontrarlo antes de que la ciudad olvide que existen."`
            },
            {
                id: 103,
                seriesId: 'blue_door',
                titleAr: 'الفصل الثالث: آخر باب',
                titleEn: 'Chapter 3: The Last Door',
                titleEs: 'Capítulo 3: La Última Puerta',
                descAr: 'وصلا إلى أعلى برج وجدا والد سامر هناك، لتبدأ رحلة العودة الحقيقية...',
                descEn: 'They reached the highest tower and found Samer\'s father, beginning the true journey back...',
                descEs: 'Llegaron a la torre más alta y encontraron al padre de Samer, comenzando el viaje de regreso...',
                contentAr: `في أعلى برج بالمدينة، فتحا الباب بالمفتاح الصغير ووجدا والده. أوضح والده أنه طوال سنوات نسي الطريق بسبب ضياع الذاكرة حتى تذكر أن لديه ابناً ينظره.
بدأت المدينة تهتز وظهر الباب الأزرق مجدداً. عبر سامر وليان، وعندما أُغلق الباب وجدا نفسيهما عند محطة القطار من جديد، وبجانبه والده قد عاد أيضاً.
فهم سامر حينها: بعض الأبواب لا تقودنا إلى أماكن جديدة… بل تعيد إلينا أشياء ظننا أننا فقدناها إلى الأبد.`,
                contentEn: `At top of the tower, they found Samer's father. As the city began to shake, the blue door reappeared. Escaping through it, Samer returned to the station to find his father standing beside him. Some doors don't lead to new places, but bring back what we thought was lost forever.`,
                contentEs: `En lo alto de la torre, encontraron al padre de Samer. Cuando la ciudad comenzó a temblar, la puerta azul reapareció. Cruzándola, Samer regresó a la estación para encontrar a su padre a su lado. Algunas puertas no llevan a lugares nuevos, sino que devuelven lo que creíamos perdido.`
            },
            /* القصة 2: الإشارة */
            {
                id: 201,
                seriesId: 'signal',
                titleAr: 'الفصل الأول: الإشارة',

                titleEs: 'Capítulo 1: La Señal',

            {
                id: 704,
                seriesId: 'midnight',
                titleAr: 'الفصل الرابع: آخر محطة',
                titleEn: 'Chapter 4: The Last Station',
                titleEs: 'Capítulo 4: La Última Estación',
                descAr: 'وجدا يوسف واستعادا المفتاح لإعادة تشغيل الزمن وإرجاع الحقيقة...',
                descEn: 'They found Youssef and restored the key to restart time and bring reality back...',
                descEs: 'Encontraron a Youssef y restauraron la llave para reiniciar el tiempo y devolver la realidad...',
                contentAr: `عثرا على يوسف في قطار قديم، وأعاد المفتاح لساعة المدينة. تحرك الزمن من جديد وعاد السكان واجتمع يوسف بأخته من جديد.`,
                contentEn: `Finding Youssef in an abandoned carriage, they convinced him to return the key. Time restarted, reuniting Youssef with his sister.`,
                contentEs: `Encontrando a Youssef en un vagón abandonado, lo convencieron de devolver la llave. El tiempo se reinició, reuniendo a Youssef con su hermana.`
            },
            {
                id: 705,
                seriesId: 'midnight',
                titleAr: 'الفصل الخامس: العودة',
                titleEn: 'Chapter 5: The Return',
                titleEs: 'Capítulo 5: El Regreso',
                descAr: 'عادا للواقع مع تذكرة جديدة نحو المستقبل المجهول...',
                descEn: 'They returned to reality with a new ticket destination towards the unknown future...',
                descEs: 'Regresaron a la realidad con un nuevo boleto hacia el futuro desconocido...',
                contentAr: `عاد سليم للمحطة بعد 7 دقائق فقط. وبعد سنوات أصبح مهندساً للقطارات ليظهر القطار الأسود مجدداً مع تذكرة تتركه يقرر الوجهة القادمة!`,
                contentEn: `Saleem returned to the real world only 7 minutes later. Years later as a train engineer, the black train returned, leaving him a blank ticket to choose the next destination!`,
                contentEs: `Saleem regresó al mundo real solo 7 minutos después. ¡Años más tarde como ingeniero, el tren negro regresó dejándole un boleto en blanco para elegir el destino!`
            }
        ]
    };

    let currentSeries = 'blue_door';
    let savedFavs = JSON.parse(localStorage.getItem('user_favs')) || [];
    let readerFontSize = 1.05;

    function init() {
        setLanguage(currentLang);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);
        
        const isRtl = lang === 'ar';
        document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;

        document.getElementById('header-title').textContent = translations[lang].title;
        document.getElementById('section-title').textContent = translations[lang].discover;
        document.getElementById('lbl-reading').textContent = translations[lang].reading;
        document.getElementById('lbl-chapters').textContent = translations[lang].chapters;
        document.getElementById('lbl-bookmarks').textContent = translations[lang].bookmarks;
        document.getElementById('search-input').placeholder = translations[lang].searchPlaceholder;
        document.getElementById('all-chapters-title').textContent = translations[lang].allChapters;
        document.getElementById('font-settings-title').textContent = translations[lang].fontSettings;
        document.getElementById('reader-back-btn').innerHTML = `<i class="fa-solid ${isRtl ? 'fa-chevron-right' : 'fa-chevron-left'}"></i>`;

        closeModal('lang-modal');
        renderTabs();
        selectSeries(currentSeries);
    }

    function getLocalizedText(obj, field) {
        if (currentLang === 'en') return obj[field + 'En'];
        if (currentLang === 'es') return obj[field + 'Es'];
        return obj[field + 'Ar'];
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('series-tabs');
        tabsContainer.innerHTML = '';
        
        data.series.forEach(s => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${s.id === currentSeries ? 'active' : ''}`;
            btn.textContent = getLocalizedText(s, 'name');
            btn.onclick = () => selectSeries(s.id);
            tabsContainer.appendChild(btn);
        });
    }

    function selectSeries(seriesId) {
        currentSeries = seriesId;
        renderTabs();
        
        const selected = data.series.find(s => s.id === seriesId);
        document.getElementById('hero-title').textContent = getLocalizedText(selected, 'name');
        document.getElementById('hero-card').style.backgroundImage = `url('${selected.image}')`;
        
        renderChapters(data.chapters.filter(c => c.seriesId === currentSeries));
    }

    function renderChapters(list) {
        const listContainer = document.getElementById('chapters-list');
        listContainer.innerHTML = '';

        if (list.length === 0) {
            const noItemsText = currentLang === 'ar' ? 'لا توجد عناصر' : (currentLang === 'es' ? 'No hay elementos' : 'No items found');
            listContainer.innerHTML = `<div style="text-align:center; color: var(--text-secondary); padding: 20px;">${noItemsText}</div>`;
            return;
        }

        list.forEach(ch => {
            const isFav = savedFavs.includes(ch.id);
            const title = sanitize(getLocalizedText(ch, 'title'));
            const desc = sanitize(getLocalizedText(ch, 'desc'));

            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.onclick = () => openChapter(ch.id);

            card.innerHTML = `
                <div class="chapter-header">
                    <div class="chapter-title">${title}</div>
                    <button class="fav-btn" onclick="toggleFav(event, ${ch.id})">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                    </button>
                </div>
                <div class="chapter-desc">${desc}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function toggleFav(e, chapterId) {
        e.stopPropagation();
        const index = savedFavs.indexOf(chapterId);
        if (index > -1) {
            savedFavs.splice(index, 1);
        } else {
            savedFavs.push(chapterId);
        }
        localStorage.setItem('user_favs', JSON.stringify(savedFavs));
        renderChapters(data.chapters.filter(c => c.seriesId === currentSeries));
    }

    function filterBookmarks() {
        showPage('home');
        document.getElementById('section-title').textContent = translations[currentLang].bookmarks;
        const bookmarked = data.chapters.filter(c => savedFavs.includes(c.id));
        renderChapters(bookmarked);
    }

    function openLangModal() {
        document.getElementById('lang-modal').classList.add('active');
    }

    function openChaptersListModal() {
        const container = document.getElementById('modal-chapters-list');
        container.innerHTML = '';
        data.chapters.forEach(ch => {
            const item = document.createElement('div');
            item.style.cssText = 'padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer;';
            item.textContent = sanitize(getLocalizedText(ch, 'title'));
            item.onclick = () => {
                closeModal('list-modal');
                openChapter(ch.id);
            };
            container.appendChild(item);
        });
        document.getElementById('list-modal').classList.add('active');
    }

    function openReaderSettings() {
        document.getElementById('settings-modal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function changeFontSize(val) {
        readerFontSize += val;
        document.getElementById('reader-text-content').style.fontSize = `${readerFontSize}rem`;
    }

    function toggleSearch() {
        const bar = document.getElementById('search-bar');
        bar.classList.toggle('active');
    }

    function filterChapters() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = data.chapters.filter(c => {
            const title = getLocalizedText(c, 'title').toLowerCase();
            return title.includes(query);
        });
        renderChapters(filtered);
    }

    function resetFilter() {
        document.getElementById('section-title').textContent = translations[currentLang].discover;
        selectSeries(currentSeries);
    }

    function setActiveNav(navId) {
             document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    function openChapter(chapterId) {
        const ch = data.chapters.find(c => c.id === chapterId);
        if (ch) {
            document.getElementById('reader-chapter-title').textContent = getLocalizedText(ch, 'title');
            document.getElementById('reader-text-content').textContent = getLocalizedText(ch, 'content');
            showPage('reader');
        }
    }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        if (pageName === 'home') {
            document.getElementById('page-home').classList.add('active');
            document.getElementById('main-header').style.display = 'flex';
        } else if (pageName === 'reader') {
            document.getElementById('page-reader').classList.add('active');
            document.getElementById('main-header').style.display = 'none';
        }
    }

    document.addEventListener('contextmenu', event => event.preventDefault());

    init();
</script>

</body>
</html>
