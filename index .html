<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Desert Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c1a1d;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .scoreboard {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            width: fit-content;
            backdrop-filter: blur(4px);
        }
        .score-val {
            color: #FFD700;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 20;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h1 {
            color: #FF4500;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
        }
        #game-over-screen p {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .restart-btn {
            background: linear-gradient(45deg, #FF8C00, #FFD700);
            color: #111;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
            margin-top: 20px;
            transition: transform 0.1s ease;
        }
        .restart-btn:active {
            transform: scale(0.92);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="scoreboard">
                <div class="score-box">النقاط: <span id="current-score" class="score-val">0</span></div>
                <div class="score-box">الذهب: 🟡 <span id="coins-count" class="score-val">0</span></div>
            </div>
        </div>

        <div id="game-over-screen">
            <h1>انتهت اللعبة!</h1>
            <p>النتيجة: <span id="final-score" class="score-val">0</span></p>
            <p>العملات: 🟡 <span id="final-coins" class="score-val">0</span></p>
            <button class="restart-btn" id="restart-btn">إعادة اللعب</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [], coins = [], scenery = [];

        let score = 0, collectedCoins = 0;
        let isGameOver = false;
        let gameSpeed = 0.8;
        let frameCount = 0;

        const lanes = [-2.6, 0, 2.6];
        let currentLane = 1;
        let targetX = lanes[currentLane];

        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.022;

        let touchStartX = 0, touchStartY = 0;

        function init() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xFFA07A);
            scene.fog = new THREE.FogExp2(0xE9967A, 0.008);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 11);
            camera.rotation.x = -0.28;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffd1a4, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffaa55, 1.2);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createEnvironment();
            createPlayer();

            window.addEventListener('resize', onWindowResize);
            setupControls();

            document.getElementById('restart-btn').addEventListener('click', restartGame);

            animate();
        }

        function createEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(100, 400);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xE28B59, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, -0.05, -150);
            scene.add(ground);

            for (let lane of lanes) {
                for (let side of [-0.6, 0.6]) {
                    const railGeo = new THREE.BoxGeometry(0.1, 0.15, 400);
                    const railMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.5 });
                    const rail = new THREE.Mesh(railGeo, railMat);
                    rail.position.set(lane + side, 0.05, -150);
                    scene.add(rail);
                }
                
                for (let z = 10; z > -350; z -= 3) {
                    const tieGeo = new THREE.BoxGeometry(1.5, 0.08, 0.4);
                    const tieMat = new THREE.MeshStandardMaterial({ color: 0x422A1D });
                    const tie = new THREE.Mesh(tieGeo, tieMat);
                    tie.position.set(lane, 0.04, z);
                    scene.add(tie);
                }
            }

            for (let i = -5; i <= 5; i++) {
                const mountainGeo = new THREE.ConeGeometry(15 + Math.random() * 10, 30 + Math.random() * 20, 5);
                const mountainMat = new THREE.MeshStandardMaterial({ color: 0xB85C37, flatShading: true });
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                mountain.position.set(i * 30, 10, -220);
                scene.add(mountain);
            }
        }
        function createPlayer() {
            playerGroup = new THREE.Group();

            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x00A86B, roughness: 0.4 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x8D5524 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0xB22222 });

            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.6;
            playerGroup.add(head);

            const hairGeo = new THREE.BoxGeometry(0.54, 0.2, 0.54);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.88;
            playerGroup.add(hair);

            const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 0.35);
            const body = new THREE.Mesh(bodyGeo, shirtMat);
            body.position.y = 1.0;
            playerGroup.add(body);

            const shortsGeo = new THREE.BoxGeometry(0.62, 0.3, 0.37);
            const shorts = new THREE.Mesh(shortsGeo, shortsMat);
            shorts.position.y = 0.55;
            playerGroup.add(shorts);

            const limbGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
            leftArm = new THREE.Mesh(limbGeo, skinMat);
            leftArm.position.set(-0.42, 0.95, 0);
            rightArm = leftArm.clone();
            rightArm.position.set(0.42, 0.95, 0);
            playerGroup.add(leftArm);
            playerGroup.add(rightArm);

            leftLeg = new THREE.Mesh(limbGeo, skinMat);
            leftLeg.position.set(-0.18, 0.25, 0);
            rightLeg = leftLeg.clone();
            rightLeg.position.set(0.18, 0.25, 0);
            playerGroup.add(leftLeg);
            playerGroup.add(rightLeg);

            playerGroup.position.set(lanes[currentLane], 0, 0);
            scene.add(playerGroup);
        }

        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = lanes[laneIndex];
            const rand = Math.random();

            let obs = new THREE.Group();

            if (rand < 0.5) {
                const trainGeo = new THREE.BoxGeometry(2.2, 2.8, 6);
                const trainMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.6 });
                const train = new THREE.Mesh(trainGeo, trainMat);
                train.position.y = 1.4;

                const roofGeo = new THREE.BoxGeometry(2.3, 0.3, 6.1);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 2.85;

                obs.add(train);
                obs.add(roof);
            } else {
                const crateGeo = new THREE.BoxGeometry(2.0, 1.3, 1.8);
                const crateMat = new THREE.MeshStandardMaterial({ color: 0xCD853F, roughness: 0.8 });
                const crate = new THREE.Mesh(crateGeo, crateMat);
                crate.position.y = 0.65;
                obs.add(crate);
            }

            obs.position.set(xPos, 0, -140);
            scene.add(obs);
            obstacles.push(obs);

            spawnCoins(laneIndex);
        }

        function spawnCoins(obsLane) {
            let coinLane = (obsLane + Math.floor(Math.random() * 2) + 1) % 3;
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });

            for (let i = 0; i < 4; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(lanes[coinLane], 0.8, -130 - (i * 3.5));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function spawnScenery() {
            const side = Math.random() > 0.5 ? 1 : -1;
            const xPos = side * (8 + Math.random() * 6);

            const cactusGroup = new THREE.Group();
            const mainMat = new THREE.MeshStandardMaterial({ color: 0x2E8B57, roughness: 0.7 });

            const stemGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 8);
            const stem = new THREE.Mesh(stemGeo, mainMat);
            stem.position.y = 1.5;
            cactusGroup.add(stem);

            const armGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 8);
            const arm1 = new THREE.Mesh(armGeo, mainMat);
            arm1.rotation.z = Math.PI / 2;
            arm1.position.set(0.5, 1.8, 0);
            cactusGroup.add(arm1);

            cactusGroup.position.set(xPos, 0, -140);
            scene.add(cactusGroup);
            scenery.push(cactusGroup);
        }

        function setupControls() {
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30 && currentLane < 2) currentLane++;
                    else if (diffX < -30 && currentLane > 0) currentLane--;
                    targetX = lanes[currentLane];
                } else {
                    if (diffY < -30 && !isJumping) {
                        isJumping = true;
                        jumpVelocity = 0.4;
                    }
                }
            }, { passive: true });

            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
                if (e.key === 'ArrowRight' && currentLane < 2) currentLane++;
                if (e.key === 'ArrowUp' && !isJumping) {
                    isJumping = true;
                    jumpVelocity = 0.4;
                }
                targetX = lanes[currentLane];
            });
        }

        function updatePlayer() {
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity += gravity;

                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            if (!isGameOver) {
                const time = Date.now() * 0.018;
                const swing = Math.sin(time) * 0.7;
                leftArm.rotation.x = swing;
                rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            }
        }

        function updateWorld() {
            frameCount++;

            if (frameCount % Math.max(25, Math.floor(60 - gameSpeed * 15)) === 0) spawnObstacle();
            if (frameCount % 10 === 0) spawnScenery();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += gameSpeed;

                if (checkCollision(playerGroup, obs)) {
                    triggerGameOver();
                }

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                if (checkCoinCollect(playerGroup, coin)) {
                    collectedCoins++;
                    document.getElementById('coins-count').innerText = collectedCoins;
                    scene.remove(coin);
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.position.z > 15) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += gameSpeed;
                if (scenery[i].position.z > 15) {
                    scene.remove(scenery[i]);
                    scenery.splice(i, 1);
                }
            }

            gameSpeed += 0.00008;
        }

        function checkCollision(player, obs) {
            const pBox = new THREE.Box3().setFromObject(player);
            pBox.min.x += 0.2; pBox.max.x -= 0.2;
            const oBox = new THREE.Box3().setFromObject(obs);
            return pBox.intersectsBox(oBox);
        }

        function checkCoinCollect(player, coin) {
            const p = player.position, c = coin.position;
            return Math.abs(p.x - c.x) < 0.9 && Math.abs(p.z - c.z) < 0.9 && Math.abs(p.y - c.y) < 1.5;
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score / 5);
            document.getElementById('final-coins').innerText = collectedCoins;
            document.getElementById('game-over-screen').classList.add('active');
        }

        function restartGame() {
            [...obstacles, ...coins, ...scenery].forEach(item => scene.remove(item));
            obstacles = []; coins = []; scenery = [];
            score = 0; collectedCoins = 0; gameSpeed = 0.8; currentLane = 1;
            targetX = lanes[currentLane]; isJumping = false;

            playerGroup.position.set(lanes[currentLane], 0, 0);
            document.getElementById('current-score').innerText = 0;
            document.getElementById('coins-count').innerText = 0;
            document.getElementById('game-over-screen').classList.remove('active');

            isGameOver = false;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            updatePlayer();
            updateWorld();

            score++;
            document.getElementById('current-score').innerText = Math.floor(score / 5);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
