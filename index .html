<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- نظام حماية CSP لمنع الثغرات والأكواد الخبيثة -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://images.unsplash.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <title id="app-title">عالم القصص والروايات</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b1528;
            --card-bg: #111e36;
            --text-color: #ffffff;
            --text-secondary: #8d9bb0;
            --accent-color: #f1c40f;
            --accent-hover: #d4ac0d;
            --border-color: #1c2d4a;
            --reader-font-size: 1.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            user-select: none; /* حماية المحتوى */
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* الهيدر العلوي */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }

        header .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        header .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-color);
        }

        /* شريط البحث */
        .search-bar {
            display: none;
            padding: 10px 15px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar.active {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
        }

        /* القوائم المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 380px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        main {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .series-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .series-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .hero-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            height: 220px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background-image 0.3s ease;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(11, 21, 40, 0.95), transparent);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            color: var(--accent-color);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .hero-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .chapter-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .chapter-card:active {
            transform: scale(0.98);
        }

        .chapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chapter-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .chapter-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* صفحة القراءة */
        .reader-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .reader-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .reader-text {
            font-size: var(--reader-font-size);
            line-height: 1.8;
            color: #e0e6ed;
            white-space: pre-line;
            text-align: justify;
            user-select: text;
        }

        /* شريط التنقل السفلي */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .lang-btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: var(--border-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .lang-btn:hover {
            background: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- الهيدر العلوي -->
    <header id="main-header">
        <button class="icon-btn" onclick="filterBookmarks()"><i id="header-bookmark-icon" class="fa-regular fa-bookmark"></i></button>
        <div class="header-title" id="header-title">عالم القصص والروايات</div>
        <div class="header-icons">
            <button class="icon-btn" onclick="openChaptersListModal()"><i class="fa-solid fa-list-ul"></i></button>
            <button class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            <!-- زر الخيارات المباشر لتبديل اللغات (...) -->
            <button class="icon-btn" onclick="openLangModal()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </header>

    <!-- شريط البحث المخفي -->
    <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="ابحث..." oninput="filterChapters()">
        <button class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <main>
        <!-- الرئيسية -->
        <section id="page-home" class="page active">
            <div class="series-tabs" id="series-tabs"></div>

            <div class="hero-card" id="hero-card">
                <div class="hero-content">
                    <div class="hero-badge" id="hero-badge-text"><i class="fa-solid fa-star"></i> السلسلة الحالية</div>
                    <div class="hero-title" id="hero-title">سرمد</div>
                </div>
            </div>

            <div class="section-title" id="section-title">اكتشف قصتك التالية</div>
            <div id="chapters-list"></div>
        </section>

        <!-- صفحة القراءة -->
        <section id="page-reader" class="page">
            <div class="reader-header">
                <button class="icon-btn" id="reader-back-btn" onclick="showPage('home')"><i class="fa-solid fa-chevron-right"></i></button>
                <div class="reader-title" id="reader-chapter-title">الفصل الأول</div>
                <button class="icon-btn" onclick="openReaderSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
            <div class="reader-text" id="reader-text-content"></div>
        </section>
    </main>

    <!-- نافذة اللغات (...) -->
    <div class="modal" id="lang-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="lang-modal-title">تغيير اللغة / Select Language</h3>
                <button class="icon-btn" onclick="closeModal('lang-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="lang-btn" onclick="setLanguage('ar')">العربية (Arabic)</button>
            <button class="lang-btn" onclick="setLanguage('en')">English (الإنجليزية)</button>
        </div>
    </div>

    <!-- نافذة منبثقة لقائمة الفصول -->
    <div class="modal" id="list-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="all-chapters-title">جميع الفصول</h3>
                <button class="icon-btn" onclick="closeModal('list-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-chapters-list" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- نافذة إعدادات القراءة -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="font-settings-title">حجم الخط</h3>
                <button class="icon-btn" onclick="closeModal('settings-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; justify-content: space-around; padding: 15px 0;">
                <button class="icon-btn" style="background:var(--border-color); padding: 8px 20px; border-radius:5px;" onclick="changeFontSize(-0.1)">A-</button>
                <button class="icon-btn" style="background:var(--border-color); padding: 8px 20px; border-radius:5px;" onclick="changeFontSize(0.1)">A+</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="setActiveNav('nav-home'); showPage('home'); resetFilter();">
            <i class="fa-solid fa-book-open"></i>
            <span id="lbl-reading">القراءة</span>
        </button>
        <button class="nav-item" id="nav-chapters" onclick="setActiveNav('nav-chapters'); openChaptersListModal();">
            <i class="fa-solid fa-list-ul"></i>
            <span id="lbl-chapters">الفصول</span>
        </button>
        <button class="nav-item" id="nav-bookmarks" onclick="setActiveNav('nav-bookmarks'); filterBookmarks();">
            <i class="fa-regular fa-bookmark"></i>
            <span id="lbl-bookmarks">العلامات</span>
        </button>
    </nav>
</div>

<script>
    // تطهير النص لمنع أية ثغرات امنية XSS
    function sanitize(str) {
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
    }

    const translations = {
        ar: {
            title: "عالم القصص والروايات",
            currentSeries: "السلسلة الحالية",
            discover: "اكتشف قصتك التالية",
            reading: "القراءة",
            chapters: "الفصول",
            bookmarks: "العلامات المرجعية والمفضلة",
            searchPlaceholder: "ابحث عن فصل...",
            allChapters: "جميع الفصول",
            fontSettings: "حجم الخط"
        },
        en: {
            title: "World of Stories & Novels",
            currentSeries: "Current Series",
            discover: "Discover Your Next Story",
            reading: "Reading",
            chapters: "Chapters",
            bookmarks: "Bookmarks & Favorites",
            searchPlaceholder: "Search chapter...",
            allChapters: "All Chapters",
            fontSettings: "Font Size"
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'ar';

    // قاعدة بيانات القصص الفعليه
    const data = {
        series: [
            { id: 'sarmad', nameAr: 'سرمَد', nameEn: 'Sarmad', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600' },
            { id: 'ticket', nameAr: 'التذكرة المفقودة', nameEn: 'The Missing Ticket', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600' },
            { id: 'blue', nameAr: 'الياقوتة الزرقاء', nameEn: 'The Blue Sapphire', image: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=600' }
        ],
        chapters: [
            /* قصة سرمد */
            {
                id: 101,
                seriesId: 'sarmad',
                titleAr: 'الفصل الأول: النداء القادم من الفراغ',
                titleEn: 'Chapter 1: The Call from the Void',
                descAr: 'في عام 2084، داخل محطة الأبحاث الفضائية "ألفا"، التقط عالم الفلك دانيال إشارة صوتية غريبة...',
                descEn: 'In 2084, inside the Alpha research station, astronomer Daniel detected a mysterious audio signal...',
                contentAr: `في عام 2084، داخل محطة الأبحاث الفضائية المعزولة "ألفا"، كان عالم الفلك دانيال يقضي لياليه أمام شاشات الرصد العملاقة، يراقب الثقوب السوداء وموت النجوم. كانت حياته روتينية مملة، حتى تلك الليلة التي التقطت فيها أجهزة الاستشعار إشارة صوتية غريبة وقوية قادمة من أعمق نقطة مظلمة في المجرة، نقطة كان العلماء يظنونها فراغاً مطلقاً.

لم تكن الإشارة مجرد موجات عشوائية، بل كانت نبضات منتظمة تشبه دقات قلب كوني. عندما قام دانيال بتحليل الشفرة الصوتية وتحويلها إلى لغة رقمية، ظهرت على الشاشة كلمة واحدة مكررة باللغة العربية القديمة: "سرمد" (والتي تعني الأبدي الذي لا بداية له ولا نهاية).

أصيب دانيال بالذهول؛ كيف لاسم يحمل معنى الأزلية أن يأتي من مكان لم يصله بشر قط؟ والأغرب من ذلك، أنه كلما استمع إلى النبض الصوتي، كان يشعر بذكائه يتضاعف، وبأن ذكرياته المنسية عن طفولته وبداية البشرية بدأت تتدفق في عقله دفعة واحدة. قرر دانيال، دون أخذ إذن من القيادة الأرضية، أن يوجه مركبة الاستكشاف الصغيرة الخاصة به نحو مصدر الإشارة، مدفوعاً بفضول غير بشري.`,
                contentEn: `In the year 2084, inside the isolated "Alpha" space research station, astronomer Daniel spent his nights monitoring black holes and dying stars. His life was routine until the night sensors picked up a powerful audio signal from the deepest dark point in the galaxy.

The signal was a pulse repeating a single word in ancient Arabic: "Sarmad" (meaning Eternity). Daniel, driven by intense curiosity, guided his exploration vessel toward the signal's source without authorization.`
            },
            {
                id: 102,
                seriesId: 'sarmad',
                titleAr: 'الفصل الثاني: مرآة الأزَل',
                titleEn: 'Chapter 2: The Mirror of Eternity',
                descAr: 'وصل دانيال إلى الإحداثيات المحددة، ليجد كتلة بلورية عملاقة تشبه مرآة كونية ضخمة...',
                descEn: 'Daniel arrived at the coordinates to find a giant crystal mass floating in space...',
                contentAr: `بعد رحلة استغرقت أسابيع عبر بوابات زمنية مصغرة، وصل دانيال إلى الإحداثيات المحددة. لم يجد كوكباً ولا مركبة فضائية، بل وجد كتلة بلورية عملاقة عائمة في الفضاء، تلمع بنور أبيض يمتص كل الظلام المحيط بها. كانت الكتلة تشبه مرآة كونية ضخمة.

عندما اقتربت مركبته، انطفأت جميع الأجهزة فجأة، ووجد دانيال نفسه يسير داخل تلك البلورة دون حاجة لبدلة فضاء، وكأنه يسبح في بحر من الوعي الخالص. هناك، لم يلتقِ بكائنات فضائية ذات مجسات، بل التقى بـ نسخة مشعة من نفسه!

تحدث الكيان المشع إلى دانيال، ليس عبر الصوت، بل عبر الأفكار: "أنت هنا لأنك تبحث عن النهاية، بينما الكون كله عبارة عن حلقة سرمدية". فهم دانيال في تلك اللحظة الحقيقة الصادمة؛ لم تكن هذه البلورة كائناً غريباً، بل كانت مكتبة الزمن الكونية. كل فكرة، وكل حضارة بشرية صعدت وسقطت، كانت تُسجل هنا. والنداء الذي التقطه على الأرض لم يكن قادماً من كائن آخر، بل كان نداءً أرسله دانيال "المستقبلي" إلى دانيال "الماضي" ليعيده إلى نقطة البداية.

اختارت البلورة دانيال ليكون حارسها الجديد، "حارس السرمدية"، الذي يراقب توازن الكون وميلاد المجرات. تلاشت مركبة دانيال، وأُعلن في سجلات الأرض أنه "مفقود في الفضاء"، لكنه في الحقيقة لم يختفِ؛ بل أصبح موجوداً في كل زمان ومكان، يراقب النجوم ويهمس للمستكشفين بكلمة واحدة ليرشدهم إلى طريق الأبدية: سرمد.`,
                contentEn: `After weeks of travel, Daniel reached a crystal structure float ing in space. Entering it, he met a radiant version of himself. He discovered the crystal was a cosmic timeline library, and the call was sent by his future self. Daniel became the new "Guardian of Eternity".`
            },
            /* قصة التذكرة المفقودة */
            {
                id: 201,
                seriesId: 'ticket',
                titleAr: 'الفصل الأول: القطار رقم 7 والفرصة الأخيرة',
                titleEn: 'Chapter 1: Train No. 7 and the Last Chance',
                descAr: 'كان آدم يقف وسط المحطة يراقب عقارب الساعة، قبل أن يكتشف اختفاء تذكرته الذهبية...',
                descEn: 'Adam stood at the central station watching the clock, only to discover his golden ticket was missing...',
                contentAr: `كان آدم يقف وسط زحام محطة القطارات المركزية، يراقب عقارب الساعة الضخمة وهي تتحرك ببطء قاتل. بالنسبة لآدم، لم تكن هذه مجرد رحلة عادية، بل كانت تذكرته نحو حياة جديدة. بعد سنوات من المحاولات الفاشلة والديون المتراكمة، تم قبول لوحته الفنية في أكبر معرض للفنون في العاصمة، وكان القطار رقم (7) الذي سينطلق بعد نصف ساعة هو وسيلته الوحيدة للوصول في الوقت المحدد؛ فلو غاب عن الافتتاح، ستضيع فرصة عمره وتُباع لوحاته لتسديد ديونه.

أدخل آدم يده في جيب معطفه ليتفقد التذكرة الذهبية التي طبعها بصعوبة بالغة، لكن فجأة... تجمد الدم في عروقه. الجيب كان فارغاً!

    let currentSeries = 'sarmad';
    let savedFavs = JSON.parse(localStorage.getItem('user_favs')) || [];
    let readerFontSize = 1.05;

    function init() {
        setLanguage(currentLang);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);
        
        const isRtl = lang === 'ar';
        document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;

        document.getElementById('header-title').textContent = translations[lang].title;
        document.getElementById('section-title').textContent = translations[lang].discover;
        document.getElementById('lbl-reading').textContent = translations[lang].reading;
        document.getElementById('lbl-chapters').textContent = translations[lang].chapters;
        document.getElementById('lbl-bookmarks').textContent = translations[lang].bookmarks;
        document.getElementById('search-input').placeholder = translations[lang].searchPlaceholder;
        document.getElementById('all-chapters-title').textContent = translations[lang].allChapters;
        document.getElementById('font-settings-title').textContent = translations[lang].fontSettings;
        document.getElementById('reader-back-btn').innerHTML = `<i class="fa-solid ${isRtl ? 'fa-chevron-right' : 'fa-chevron-left'}"></i>`;

        closeModal('lang-modal');
        renderTabs();
        selectSeries(currentSeries);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('series-tabs');
        tabsContainer.innerHTML = '';
        
        data.series.forEach(s => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${s.id === currentSeries ? 'active' : ''}`;
            btn.textContent = currentLang === 'ar' ? s.nameAr : s.nameEn;
            btn.onclick = () => selectSeries(s.id);
            tabsContainer.appendChild(btn);
        });
    }

    function selectSeries(seriesId) {
        currentSeries = seriesId;
        renderTabs();
        
        const selected = data.series.find(s => s.id === seriesId);
        document.getElementById('hero-title').textContent = currentLang === 'ar' ? selected.nameAr : selected.nameEn;
        document.getElementById('hero-card').style.backgroundImage = `url('${selected.image}')`;
        
        renderChapters(data.chapters.filter(c => c.seriesId === currentSeries));
    }

    function renderChapters(list) {
        const listContainer = document.getElementById('chapters-list');
        listContainer.innerHTML = '';

        if (list.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color: var(--text-secondary); padding: 20px;">${currentLang === 'ar' ? 'لا توجد عناصر' : 'No items found'}</div>`;
            return;
        }

        list.forEach(ch => {
            const isFav = savedFavs.includes(ch.id);
            const title = sanitize(currentLang === 'ar' ? ch.titleAr : ch.titleEn);
            const desc = sanitize(currentLang === 'ar' ? ch.descAr : ch.descEn);

            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.onclick = () => openChapter(ch.id);

            card.innerHTML = `
                <div class="chapter-header">
                    <div class="chapter-title">${title}</div>
                    <button class="fav-btn" onclick="toggleFav(event, ${ch.id})">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                    </button>
                </div>
                <div class="chapter-desc">${desc}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function toggleFav(e, chapterId) {
        e.stopPropagation();
        const index = savedFavs.indexOf(chapterId);
        if (index > -1) {
            savedFavs.splice(index, 1);
        } else {
            savedFavs.push(chapterId);
        }
        localStorage.setItem('user_favs', JSON.stringify(savedFavs));
        renderChapters(data.chapters.filter(c => c.seriesId === currentSeries));
    }

    function filterBookmarks() {
        showPage('home');
        document.getElementById('section-title').textContent = translations[currentLang].bookmarks;
        const bookmarked = data.chapters.filter(c => savedFavs.includes(c.id));
        renderChapters(bookmarked);
    }

    function openLangModal() {
        document.getElementById('lang-modal').classList.add('active');
    }

    function openChaptersListModal() {
        const container = document.getElementById('modal-chapters-list');
        container.innerHTML = '';
        data.chapters.forEach(ch => {
            const item = document.createElement('div');
            item.style.cssText = 'padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer;';
            item.textContent = sanitize(currentLang === 'ar' ? ch.titleAr : ch.titleEn);
            item.onclick = () => {
                closeModal('list-modal');
                openChapter(ch.id);
            };
            container.appendChild(item);
        });
        document.getElementById('list-modal').classList.add('active');
    }

    function openReaderSettings() {
        document.getElementById('settings-modal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function changeFontSize(val) {
        readerFontSize += val;
        document.getElementById('reader-text-content').style.fontSize = `${readerFontSize}rem`;
    }

    function toggleSearch() {
        const bar = document.getElementById('search-bar');
        bar.classList.toggle('active');
    }

    function filterChapters() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = data.chapters.filter(c => {
            const title = (currentLang === 'ar' ? c.titleAr : c.titleEn).toLowerCase();
            return title.includes(query);
        });
        renderChapters(filtered);
    }

    function resetFilter() {
        document.getElementById('section-title').textContent = translations[currentLang].discover;
        selectSeries(currentSeries);
    }

    function setActiveNav(navId) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    function openChapter(chapterId) {
        const ch = data.chapters.find(c => c.id === chapterId);
        if (ch) {
            document.getElementById('reader-chapter-title').textContent = currentLang === 'ar' ? ch.titleAr : ch.titleEn;
            document.getElementById('reader-text-content').textContent = currentLang === 'ar' ? ch.contentAr : ch.contentEn;
            showPage('reader');
        }
    }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        if (pageName === 'home') {
            document.getElementById('page-home').classList.add('active');
            document.getElementById('main-header').style.display = 'flex';
        } else if (pageName === 'reader') {
            document.getElementById('page-reader').classList.add('active');
            document.getElementById('main-header').style.display = 'none';
        }
    }

    document.addEventListener('contextmenu', event => event.preventDefault());

    init();
</script>

</body>
</html>
