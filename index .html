<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Desert Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* =========================
           واجهة أثناء اللعب العلوي
        ========================= */
        #ui-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        #score-box {
            position: absolute;
            top: 18px;
            right: 18px;
            min-width: 130px;
            padding: 10px 18px;
            border-radius: 18px;
            background: rgba(90, 50, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        #coins-box {
            position: absolute;
            top: 72px;
            right: 18px;
            min-width: 130px;
            padding: 8px 16px;
            border-radius: 16px;
            background: rgba(90, 50, 20, 0.75);
            border: 1px solid rgba(255, 215, 80, 0.3);
            backdrop-filter: blur(8px);
            color: #ffd84d;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        #pause-btn {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: rgba(90, 50, 20, 0.75);
            color: white;
            font-size: 20px;
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        /* =========================
           الشاشات والمنبثقات
        ========================= */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: linear-gradient(135deg, #f1a278, #d97736);
            color: white;
        }

        .panel {
            width: min(420px, 92vw);
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            background: rgba(25, 18, 12, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(145deg, #ffb74d, #f57c00);
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(245, 124, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .best-score {
            margin-bottom: 20px;
            color: #ffd76a;
            font-weight: bold;
        }

        .main-btn {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffb74d, #f57c00);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 124, 0, 0.3);
        }

        .secondary-btn {
            width: 100%;
            padding: 13px 18px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .result-number {
            font-size: 36px;
            color: #ffd76a;
            font-weight: bold;
            margin: 10px 0 18px;
        }

        @media(max-width: 600px) {
            h1 { font-size: 28px; }
            .panel { padding: 28px 18px; }
            #score-box { top: 14px; right: 14px; font-size: 16px; min-width: 110px; }
            #coins-box { top: 65px; right: 14px; font-size: 14px; min-width: 110px; }
            #pause-btn { top: 14px; left: 14px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- شاشة البداية -->
        <div id="start-screen" class="screen">
            <div class="panel">
                <div class="logo">🏜️</div>
                <h1>Desert Runner</h1>
                <p class="subtitle">
                    اركض، اقفز، اجمع العملات...
                    <br>
                    وحاول البقاء لأطول وقت ممكن! 🔥
                </p>
                <div class="best-score">
                    أفضل نتيجة: <span id="best-score">0</span>
                </div>
                <button id="start-btn" class="main-btn">▶ ابدأ اللعب</button>
            </div>
        </div>

        <!-- شاشة الإيقاف المؤقت -->
        <div id="pause-screen" class="screen hidden">
            <div class="panel">
                <div class="logo">⏸️</div>
                <h1>اللعبة متوقفة</h1>
                <p class="subtitle">خذ نفسًا... ثم تابع المغامرة 😎</p>
                <button id="resume-btn" class="main-btn">▶ متابعة</button>
                <button id="restart-btn-pause" class="secondary-btn">🔄 إعادة اللعب</button>
                <button id="home-btn-pause" class="secondary-btn">🏠 الرئيسية</button>
            </div>
        </div>

        <!-- شاشة الخسارة -->
        <div id="game-over-screen" class="screen hidden">
            <div class="panel">
                <div class="logo">💥</div>
                <h1>انتهت اللعبة</h1>
                <p class="subtitle">وصلت إلى:</p>
                <div class="result-number"><span id="final-score">0</span></div>
                <p class="best-score">أفضل نتيجة: <span id="final-best-score">0</span></p>
                <button id="restart-btn" class="main-btn">🔄 العب من جديد</button>
                <button id="home-btn" class="secondary-btn">🏠 الرئيسية</button>
            </div>
        </div>

        <!-- الواجهة أثناء اللعب -->
        <div id="ui-layer">
            <div id="score-box">النقاط: <span id="score">0</span></div>
            <div id="coins-box">الذهب: <span id="coins">0</span> 🟡</div>
            <button id="pause-btn">⏸</button>
        </div>
    </div>

    <script>
        let gameState = "menu";
        let score = 0, collectedCoins = 0;
        let bestScore = Number(localStorage.getItem("desertRunnerBest") || 0);

        let scene, camera, renderer;
        let playerGroup, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [], coins = [], scenery = [];

        let gameSpeed = 0.8;
        let frameCount = 0;

        const lanes = [-2.6, 0, 2.6];
        let currentLane = 1;
        let targetX = lanes[currentLane];

        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.022;

        let touchStartX = 0, touchStartY = 0;

        const startScreen = document.getElementById("start-screen");
        const pauseScreen = document.getElementById("pause-screen");
        const gameOverScreen = document.getElementById("game-over-screen");

        const startBtn = document.getElementById("start-btn");
        const pauseBtn = document.getElementById("pause-btn");
        const resumeBtn = document.getElementById("resume-btn");
        const restartBtn = document.getElementById("restart-btn");
        const restartBtnPause = document.getElementById("restart-btn-pause");
        const homeBtn = document.getElementById("home-btn");
        const homeBtnPause = document.getElementById("home-btn-pause");

        const scoreElement = document.getElementById("score");
        const coinsElement = document.getElementById("coins");
        const bestScoreElement = document.getElementById("best-score");
        const finalScoreElement = document.getElementById("final-score");
        const finalBestScoreElement = document.getElementById("final-best-score");

        function init() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xFFA07A);
            scene.fog = new THREE.FogExp2(0xE9967A, 0.008);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 11);
            camera.rotation.x = -0.28;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffd1a4, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffaa55, 1.2);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createEnvironment();
            createPlayer();

            window.addEventListener('resize', onWindowResize);
            setupControls();

            bestScoreElement.textContent = bestScore;
            animate();
        }

        function createEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(100, 400);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xE28B59, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, -0.05, -150);
            scene.add(ground);

            for (let lane of lanes) {
                for (let side of [-0.6, 0.6]) {
                    const railGeo = new THREE.BoxGeometry(0.1, 0.15, 400);
                    const railMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.5 });
                    const rail = new THREE.Mesh(railGeo, railMat);
                    rail.position.set(lane + side, 0.05, -150);
                    scene.add(rail);
                }
                
                for (let z = 10; z > -350; z -= 3) {
                    const tieGeo = new THREE.BoxGeometry(1.5, 0.08, 0.4);
                    const tieMat = new THREE.MeshStandardMaterial({ color: 0x422A1D });
                    const tie = new THREE.Mesh(tieGeo, tieMat);
                    tie.position.set(lane, 0.04, z);
                    scene.add(tie);
                }
            }

            for (let i = -5; i <= 5; i++) {
                const mountainGeo = new THREE.ConeGeometry(15 + Math.random() * 10, 30 + Math.random() * 20, 5);
                const mountainMat = new THREE.MeshStandardMaterial({ color: 0xB85C37, flatShading: true });
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                mountain.position.set(i * 30, 10, -220);
                scene.add(mountain);
            }
        }

        function createPlayer() {
            playerGroup = new THREE.Group();

            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x00A86B, roughness: 0.4 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x8D5524 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0xB22222 });

            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.6;
            playerGroup.add(head);

            const hairGeo = new THREE.BoxGeometry(0.54, 0.2, 0.54);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.88;
            playerGroup.add(hair);

            const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 0.35);
            const body = new THREE.Mesh(bodyGeo, shirtMat);
            body.position.y = 1.0;
            playerGroup.add(body);

            const shortsGeo = new THREE.BoxGeometry(0.62, 0.3, 0.37);
            const shorts = new THREE.Mesh(shortsGeo, shortsMat);
            shorts.position.y = 0.55;
            playerGroup.add(shorts);

            const limbGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
            leftArm = new THREE.Mesh(limbGeo, skinMat);
            leftArm.position.set(-0.42, 0.95, 0);
            rightArm = leftArm.clone();
            rightArm.position.set(0.42, 0.95, 0);
            playerGroup.add(leftArm);
            playerGroup.add(rightArm);

            leftLeg = new THREE.Mesh(limbGeo, skinMat);
            leftLeg.position.set(-0.18, 0.25, 0);
            rightLeg = leftLeg.clone();
            rightLeg.position.set(0.18, 0.25, 0);
            playerGroup.add(leftLeg);
            playerGroup.add(rightLeg);

            playerGroup.position.set(lanes[currentLane], 0, 0);
            scene.add(playerGroup);
        }

        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = lanes[laneIndex];
            const rand = Math.random();

            let obs = new THREE.Group();

            if (rand < 0.5) {
                const trainGeo = new THREE.BoxGeometry(2.2, 2.8, 6);
                const trainMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.6 });
                const train = new THREE.Mesh(trainGeo, trainMat);
                train.position.y = 1.4;

                const roofGeo = new THREE.BoxGeometry(2.3, 0.3, 6.1);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 2.85;

                obs.add(train);
                obs.add(roof);
            } else {
                const crateGeo = new THREE.BoxGeometry(2.0, 1.3, 1.8);
                const crateMat = new THREE.MeshStandardMaterial({ color: 0xCD853F, roughness: 0.8 });
                const crate = new THREE.Mesh(crateGeo, crateMat);
                crate.position.y = 0.65;
                obs.add(crate);
            }

            obs.position.set(xPos, 0, -140);
            scene.add(obs);
            obstacles.push(obs);

            spawnCoins(laneIndex);
        }

        function spawnCoins(obsLane) {
            let coinLane = (obsLane + Math.floor(Math.random() * 2) + 1) % 3;
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });

            for (let i = 0; i < 4; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(lanes[coinLane], 0.8, -130 - (i * 3.5));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function spawnScenery() {
            const side = Math.random() > 0.5 ? 1 : -1;
            const xPos = side * (8 + Math.random() * 6);

            const cactusGroup = new THREE.Group();
            const mainMat = new THREE.MeshStandardMaterial({ color: 0x2E8B57, roughness: 0.7 });

            const stemGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 8);
            const stem = new THREE.Mesh(stemGeo, mainMat);
            stem.position.y = 1.5;
            cactusGroup.add(stem);

            const armGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 8);
            const arm1 = new THREE.Mesh(armGeo, mainMat);
            arm1.rotation.z = Math.PI / 2;
            arm1.position.set(0.5, 1.8, 0);
            cactusGroup.add(arm1);

            cactusGroup.position.set(xPos, 0, -140);
            scene.add(cactusGroup);
            scenery.push(cactusGroup);
        }

        function setupControls() {
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (gameState !== "playing") return;
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30 && currentLane < 2) currentLane++;
                    else if (diffX < -30 && currentLane > 0) currentLane--;
                    targetX = lanes[currentLane];
                } else {
                    if (diffY < -30 && !isJumping) {
                        isJumping = true;
                        jumpVelocity = 0.4;
                    }
                }
            }, { passive: true });

            window.addEventListener('keydown', (e) => {
                if (gameState !== "playing") return;
                if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) currentLane--;
                if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 2) currentLane++;
                if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !isJumping) {
                    isJumping = true;
                    jumpVelocity = 0.4;
                }
                targetX = lanes[currentLane];
            });

            startBtn.addEventListener("click", startGame);
            pauseBtn.addEventListener("click", pauseGame);
            resumeBtn.addEventListener("click", resumeGame);
            restartBtn.addEventListener("click", startGame);
            restartBtnPause.addEventListener("click", startGame);
            homeBtn.addEventListener("click", showHome);
            homeBtnPause.addEventListener("click", showHome);
        }

        function startGame() {
            score = 0;
            collectedCoins = 0;
            gameSpeed = 0.8;
            currentLane = 1;
            targetX = lanes[currentLane];
            isJumping = false;

            [...obstacles, ...coins, ...scenery].forEach(item => scene.remove(item));
            obstacles = []; coins = []; scenery = [];

            playerGroup.position.set(lanes[currentLane], 0, 0);
            scoreElement.innerText = 0;
            coinsElement.innerText = 0;

            startScreen.classList.add("hidden");
            pauseScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");

            gameState = "playing";
        }

                function pauseGame() {
            if (gameState === "playing") {
                gameState = "paused";
                pauseScreen.classList.remove("hidden");
            }
        }

        function resumeGame() {
            if (gameState === "paused") {
                gameState = "playing";
                pauseScreen.classList.add("hidden");
            }
        }

        function showHome() {
            gameState = "menu";
            startScreen.classList.remove("hidden");
            pauseScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");
        }

        function updatePlayer() {
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity += gravity;

                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            if (gameState === "playing") {
                const time = Date.now() * 0.018;
                const swing = Math.sin(time) * 0.7;
                leftArm.rotation.x = swing;
                rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            }
        }

        function updateWorld() {
            frameCount++;

            if (frameCount % Math.max(25, Math.floor(60 - gameSpeed * 15)) === 0) spawnObstacle();
            if (frameCount % 10 === 0) spawnScenery();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += gameSpeed;

                if (checkCollision(playerGroup, obs)) {
                    triggerGameOver();
                }

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                if (checkCoinCollect(playerGroup, coin)) {
                    collectedCoins++;
                    coinsElement.innerText = collectedCoins;
                    scene.remove(coin);
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.position.z > 15) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            for (let i = scenery.length - 1; i >= 0; i--) {
                scenery[i].position.z += gameSpeed;
                if (scenery[i].position.z > 15) {
                    scene.remove(scenery[i]);
                    scenery.splice(i, 1);
                }
            }

            gameSpeed += 0.00008;
        }

        function checkCollision(player, obs) {
            const pBox = new THREE.Box3().setFromObject(player);
            pBox.min.x += 0.2; pBox.max.x -= 0.2;
            const oBox = new THREE.Box3().setFromObject(obs);
            return pBox.intersectsBox(oBox);
        }

        function checkCoinCollect(player, coin) {
            const p = player.position, c = coin.position;
            return Math.abs(p.x - c.x) < 0.9 && Math.abs(p.z - c.z) < 0.9 && Math.abs(p.y - c.y) < 1.5;
        }

        function triggerGameOver() {
            gameState = "gameover";
            const finalScoreVal = Math.floor(score / 5);
            if (finalScoreVal > bestScore) {
                bestScore = finalScoreVal;
                localStorage.setItem("desertRunnerBest", bestScore);
            }
            finalScoreElement.innerText = finalScoreVal;
            finalBestScoreElement.innerText = bestScore;
            bestScoreElement.innerText = bestScore;
            gameOverScreen.classList.remove("hidden");
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameState === "playing") {
                updatePlayer();
                updateWorld();

                score++;
                scoreElement.innerText = Math.floor(score / 5);
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
